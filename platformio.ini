[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.filesystem = littlefs
board_build.partitions = partitions/ota_4mb.csv
lib_compat_mode = soft

lib_deps =
    https://github.com/jonblack/arduino-fsm.git
    khoih-prog/ESP_DoubleResetDetector@^1.3.2
    tzapu/WiFiManager
    knolleary/PubSubClient@^2.8
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    ayushsharma82/WebSerial
    bblanchon/ArduinoJson@^6.21.5

; Historical controlled rollback image. It deliberately refuses first-boot
; validation so UpdateService marks it invalid and the bootloader rolls back.
[env:nodemcu-32s-rollback-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.4-rollback-test\"
    -DPROJ_FW_BUILD=5
    -DPROJ_OTA_TEST_FORCE_VALIDATION_FAILURE=1

; Next signed-package candidate used for manual signed Web OTA regression tests.
[env:nodemcu-32s-signed-update-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.9\"
    -DPROJ_FW_BUILD=10

; Lab transition image for the next repeatable remote-OTA proof. HTTP is enabled
; only in this controlled image. Production/default builds remain HTTPS-only.
[env:nodemcu-32s-remote-update-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.9-remote-test\"
    -DPROJ_FW_BUILD=10
    -DPROJ_REMOTE_UPDATE_ALLOW_HTTP=1
    -DPROJ_OTA_TEST_MQTT_LOOPBACK_ENDPOINT=1

; Target image for the next repeatable remote OTA proof. It returns to the
; default HTTPS-only policy after reboot.
[env:nodemcu-32s-remote-target-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.10\"
    -DPROJ_FW_BUILD=11
