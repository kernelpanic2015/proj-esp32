[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.filesystem = littlefs
board_build.partitions = partitions/ota_4mb.csv
lib_compat_mode = soft

lib_deps =
    https://github.com/jonblack/arduino-fsm.git
    khoih-prog/ESP_DoubleResetDetector@^1.3.2
    tzapu/WiFiManager
    knolleary/PubSubClient@^2.8
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    ayushsharma82/WebSerial
    bblanchon/ArduinoJson@^6.21.5

; Controlled lab-only image. It deliberately refuses first-boot validation so
; UpdateService must mark the image invalid and roll back to the last good slot.
[env:nodemcu-32s-rollback-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.4-rollback-test\"
    -DPROJ_FW_BUILD=5
    -DPROJ_OTA_TEST_FORCE_VALIDATION_FAILURE=1

; Signed-package candidate used for manual signed Web OTA regression tests.
[env:nodemcu-32s-signed-update-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.7\"
    -DPROJ_FW_BUILD=8

; Lab transition image that enables HTTP only so remote manifest/download can
; be proven against a temporary LAN fixture. Production/default builds reject
; plain HTTP and accept only HTTPS remote update URLs.
[env:nodemcu-32s-remote-update-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.7-remote-test\"
    -DPROJ_FW_BUILD=8
    -DPROJ_REMOTE_UPDATE_ALLOW_HTTP=1

; Target image for the first remote OTA proof. It has the same remote update
; implementation but returns to the default HTTPS-only policy after reboot.
[env:nodemcu-32s-remote-target-test]
extends = env:nodemcu-32s
build_flags =
    -DPROJ_FW_VERSION=\"0.1.8\"
    -DPROJ_FW_BUILD=9
